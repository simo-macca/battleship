name: Lab CI

on:
  push:
    tags:
      - '*'
    paths-ignore:
      - '**.md'
      - '.gitignore'

jobs:
  lab-ci:
    runs-on: ubuntu-22.04
    steps:
      - name: Project checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
      - name: Build
        id: build
        run: |
          ./gradlew assemble
      - name: Check
        id: check
        if: success()
        run: |
          ./gradlew check
      - name: Upload check reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-reports
          path: build/reports/
